/<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BONK Metrics</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin: 5px 0 0;
            color: #aaa;
        }
        nav {
    margin-top: 20px;
}

nav a {
    color: white;
    text-decoration: none;
    margin-right: 25px;
    font-size: 14px;
}

nav a:hover {
    text-decoration: underline;
}

        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            margin-top: 0;
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
        }

        .value {
            font-size: 28px;
            font-weight: bold;
        }

        .section {
            margin-top: 30px;
        }

        .section h2 {
            margin-bottom: 15px;
        }

        .supply-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        @media (max-width: 768px) {
            .cards,
            .supply-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<div style=" text-align: center; color: #8B0000; font-weight: bold; margin: 50px 0 30px 0; "> build on going </div>
<header>
    <h1>BONK Metrics</h1>
    <p>Solana / BONK Analytics Platform</p>

    <nav>
        <a href="#">Overview</a>
        <a href="#">Supply</a>
        <a href="https://vi.wordpress.org/">Burn</a>
        <a href="#">Holders</a>
        <a href="#">Transactions</a>
    </nav>
</header>

    <main>

        <!-- Market overview -->

        <div class="cards">

            <div class="card">
                <h3>Price</h3>
                <div class="value" id="price">---</div>
            </div>

            <div class="card">
                <h3>Market Cap</h3>
                <div class="value" id="market_cap">---</div>
            </div>

            <div class="card">
                <h3>24h Volume</h3>
                <div class="value" id="24h_volume">---</div>
            </div>

        </div>

        <!-- Supply -->

        <div class="section">

            <h2>BONK Supply</h2>

            <div class="supply-grid">

                <div class="card">
                    <h3>Total Supply</h3>
                    <div class="value">---</div>
                </div>

                <div class="card">
                    <h3>Burned</h3>
                    <div class="value">---</div>
                </div>

                <div class="card">
                    <h3>Circulating Supply</h3>
                    <div class="value">---</div>
                </div>

            </div>

        </div>

    </main>
<script>

  async function loadBonkData() {

        try {

            const response = await fetch(
                "https://api.coingecko.com/api/v3/simple/price?ids=bonk&vs_currencies=usd&include_market_cap=true&include_24hr_vol=true"
            );

            const data = await response.json();

            const bonk = data.bonk;

            // Price
            document.getElementById("price").textContent =
                "$" + bonk.usd;

            // Market Cap
            document.getElementById("market_cap").textContent =
                "$" + Math.round(bonk.usd_market_cap).toLocaleString();

            // 24h Volume
            document.getElementById("24h_volume").textContent =
                "$" + Math.round(bonk.usd_24h_vol).toLocaleString();

        } catch (error) {

            document.getElementById("price").textContent =
                "Unavailable";

            document.getElementById("market_cap").textContent =
                "Unavailable";

            document.getElementById("24h_volume").textContent =
                "Unavailable";

            console.error(error);
        }

    }

    loadBonkData();
    setInterval(loadBonkData, 120000);
</script>
</body>

</html>
